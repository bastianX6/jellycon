version: '1.0.8~beta'
changelog: |-
  New Features
  ------------
  + Add Unwatched / Watched / Favorite / Continue Watching filters to media listings
  + Add Favorites entry to the main menu showing all favorite items
  + Animated GIF preview thumbnails (use local .gif proxy so Kodi animates them)

  Bug Fixes
  ---------
  + Fix addon startup crash caused by circular import
  + Fix GIF proxy authentication (include image Tag in proxy URL)
  + Use Kodi-valid version notation (1.0.3~beta+py3) to fix install crash
  + Fix empty Favorites list (remove IncludeItemTypes restriction)
  + Show Filters entry on all media listings including home videos/mixed
  + Show Filters at every navigation level
  + Fix empty Watched / Continue Watching results (bool casing, Video type, /Shows normalization)
dependencies:
  py2:
    - addon: 'xbmc.python'
      version: '2.25.0'
    - addon: 'script.module.requests'
      version: '2.22.0'
    - addon: 'script.module.dateutil'
      version: '2.8.1'
    - addon: 'script.module.six'
      version: '1.13.0'
    - addon: 'script.module.kodi-six'
      version: '0.0.7'
    - addon: 'script.module.addon.signals'
      version: '0.0.5'
    - addon: 'script.module.futures'
      version: '2.2.0'
    - addon: 'script.module.websocket'
      version: '0.57.0'
  py3:
    - addon: 'xbmc.python'
      version: '3.0.0'
    - addon: 'script.module.requests'
      version: '2.22.0+matrix.1'
    - addon: 'script.module.dateutil'
      version: '2.8.1+matrix.1'
    - addon: 'script.module.six'
      version: '1.14.0+matrix.2'
    - addon: 'script.module.kodi-six'
      version: '0.1.3+1'
    - addon: 'script.module.addon.signals'
      version: '0.0.5+matrix.1'
    - addon: 'script.module.websocket'
      version: '0.57.0+matrix.1'
